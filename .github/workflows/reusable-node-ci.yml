name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use.
        required: false
        type: string
        default: "20"
      run-script:
        description: npm script to run for CI.
        required: false
        type: string
        default: ci

jobs:
  node-ci:
    name: Node.js CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run npm script
        run: npm run ${{ inputs.run-script }}
